[project]
name = "opencmo-engine"
version = "0.1.0"
license = "AGPL-3.0-only"
description = "OpenCMO clipping engine — long-form video to vertical short clips"
requires-python = ">=3.11"
dependencies = [
    # `default`: kéo `yt-dlp-ejs` — script giải đề chữ ký YouTube cho JS runtime.
    "yt-dlp[default]>=2025.11.12",
    "httpx>=0.27",
    # Moment selection and output moderation run on Claude.
    "anthropic>=0.40",
    "pydantic>=2.6",
    "rich>=13.7",
    "typer>=0.12",
]

[project.optional-dependencies]
# Bám mặt. Không bắt buộc — thiếu thì engine tự fallback về center-crop.
# CẦN Python <= 3.12: MediaPipe phát hành wheel chậm hơn Python vài phiên bản.
face = ["mediapipe>=0.10", "numpy>=1.26"]
# Chỉ cần trên máy deploy worker.
worker = ["modal>=0.64"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
opencmo = "opencmo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["opencmo"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-ignore = [
    # typer BẮT BUỘC gọi typer.Option()/typer.Argument() trong default của tham số
    # — đó là cách khai báo CLI của nó, không phải lỗi.
    "B008",
]
