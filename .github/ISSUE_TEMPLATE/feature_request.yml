name: Feature request
description: Propose an improvement or a new capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you'd like it to work. Sketches welcome.
  - type: checkboxes
    id: rules
    attributes:
      label: Product rules
      description: OpenCMO assists; it never acts for the user without approval (see CONTRIBUTING.md).
      options:
        - label: This doesn't post, like, follow or comment automatically, and doesn't process video the user doesn't own.
          required: true
